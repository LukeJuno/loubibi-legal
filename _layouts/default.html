<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}{% if page.title != "Loubibi" %} | Loubibi{% endif %}</title>
  <link rel="icon" href="{{ '/assets/loubibi-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/legal.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ '/' | relative_url }}">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="{{ '/assets/loubibi-logo.svg' | relative_url }}">
        <img src="{{ '/assets/loubibi-logo-light.svg' | relative_url }}" alt="Loubibi" height="54">
      </picture>
    </a>
    <nav>
      <a href="{{ '/privacy-policy.html' | relative_url }}">Privacy</a>
      <a href="{{ '/terms-of-service.html' | relative_url }}">Terms</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    Questions? <a href="mailto:loubibiapp@gmail.com">loubibiapp@gmail.com</a>
  </footer>
</body>
</html>
