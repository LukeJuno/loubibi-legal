<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Join a family on Loubibi</title>
<style>
  :root{color-scheme:light dark;--bg:#f1f3ea;--ink:#2f2924;--muted:#6b6259;--btn:#c98a6b;--card:#fbfcf7;--line:#dfe4d3}
  @media (prefers-color-scheme:dark){:root{--bg:#1d211a;--ink:#f1f3ea;--muted:#b8b0a4;--card:#252a21;--line:#363d2f}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
  main{max-width:420px;width:100%;text-align:center}
  h1{font-size:26px;margin:0 0 8px}
  p{color:var(--muted);margin:0 0 20px}
  .code{font-size:34px;font-weight:700;letter-spacing:.2em;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 8px;margin:0 0 24px}
  a.btn{display:block;background:var(--btn);color:#2f2924;text-decoration:none;font-weight:700;border-radius:999px;padding:16px 24px;font-size:17px}
  small{display:block;margin-top:20px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Join a family on Loubibi</h1>
  <p id="msg">Tap the button to open Loubibi and join.</p>
  <div class="code" id="code" hidden></div>
  <a class="btn" id="open" href="#">Open Loubibi</a>
  <small>Don't have the app yet? Ask the person who invited you for the download link, then come back and tap the button.</small>
</main>
<script>
  var raw = new URLSearchParams(location.search).get("code") || "";
  var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
  var btn = document.getElementById("open");
  if (!code) {
    document.getElementById("msg").textContent = "This invite link is missing its code. Ask for a new one.";
    btn.style.display = "none";
  } else {
    var box = document.getElementById("code");
    box.hidden = false; box.textContent = code;
    var target = "loubibi://invite/" + code;
    btn.href = target;
    setTimeout(function () { location.href = target; }, 400);
  }
</script>
</body>
</html>
